<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost CEO Dashboard</title>
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard {
            border: 5px solid #FFD700;
            padding: 40px;
            border-radius: 20px;
            background: linear-gradient(145deg, #2e004f, #000000);
            box-shadow: 0 0 30px #800080;
        }
        h1 { font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; }
        #mic-btn {
            background-color: #800080;
            color: #FFD700;
            border: 2px solid #FFD700;
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        #mic-btn:hover {
            background-color: #FFD700;
            color: #800080;
            transform: scale(1.1);
        }
        #response { margin-top: 30px; font-style: italic; color: #fff; height: 50px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Ghost CEO</h1>
        <p>HIGH-STACK TICKET AUDITS</p>
        <button id="mic-btn" onclick="startVoice()">🎤 COMMUNICATE</button>
        <div id="response">Waiting for directive, Commander TRU...</div>
    </div>

    <script>
        function startVoice() {
            const responseDiv = document.getElementById('response');
            responseDiv.innerText = "Listening...";
            
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.continuous = false; 
            recognition.interimResults = true; // This lets us see words LIVE

            recognition.onresult = function(event) {
                let transcript = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                
                // Show words as you say them
                responseDiv.innerText = "Heard: " + transcript;

                if (event.results[0].isFinal) {
                    responseDiv.innerText = "Analyzing: " + transcript;
                    fetch('/command', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ cmd: transcript })
                    })
                    .then(res => res.json())
                    .then(data => {
                        responseDiv.innerText = data.response;
                    })
                    .catch(err => {
                        responseDiv.innerText = "Connection Error. Check Northflank logs.";
                    });
                }
            };

            recognition.onerror = function(event) {
                responseDiv.innerText = "Mic Error: " + event.error;
            };

            recognition.start();
        }
    </script>
</body>
</html>
