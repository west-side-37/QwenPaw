<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST CEO | COMMAND DECK</title>
    <style>
        body { background-color: #0F0F0F; color: #FFD700; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; border-top: 5px solid #FFD700; }
        .deck { background: #1A1A1A; padding: 40px; border-radius: 25px; box-shadow: 0 0 50px #6A0DAD; border: 2px solid #6A0DAD; width: 450px; text-align: center; }
        h1 { font-size: 2.5rem; letter-spacing: 4px; margin-bottom: 5px; text-shadow: 2px 2px #000; }
        .sub-header { color: #888; font-weight: bold; margin-bottom: 25px; font-size: 0.8rem; letter-spacing: 2px; }
        
        /* THE COMMAND BOX - FORCED INTERACTION */
        .input-area { margin-bottom: 20px; position: relative; z-index: 9999; }
        input[type="text"] {
            background: #000 !important;
            color: #FFD700 !important;
            border: 2px solid #FFD700 !important;
            padding: 15px;
            width: 90%;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            text-align: center;
            display: block;
            margin: 0 auto;
        }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        button { background: #6A0DAD; color: #FFD700; border: 2px solid #FFD700; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #FFD700; color: #000; }
        
        #log { margin-top: 30px; padding: 15px; background: #000; border-radius: 10px; border-left: 5px solid #FFD700; font-family: 'Courier New', monospace; color: #BB86FC; text-align: left; min-height: 60px; }
    </style>
</head>
<body>
    <div class="deck">
        <h1>GHOST CEO</h1>
        <div class="sub-header">HIGH-STACK TICKET AUDITS | COMMANDER TRU</div>

        <div class="input-area">
            <input type="text" id="cmd_input" placeholder="ENTER DIRECTIVE..." autofocus>
        </div>

        <div class="btn-group">
            <button onclick="execute()">EXECUTE</button>
            <button onclick="execute('audit')">AUTO-AUDIT</button>
        </div>

        <div id="log">> Awaiting instructions, Commander...</div>
    </div>

    <script>
        const log = document.getElementById('log');
        const input = document.getElementById('cmd_input');

        // Allow pressing "Enter" to send
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") execute(); });

        async function execute(preset) {
            const val = preset || input.value;
            if (!val) return;

            log.innerText = "> [SYSTEM]: Transmitting to Ghost CEO...";
            
            try {
                const response = await fetch('/command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cmd: val})
                });
                const data = await response.json();
                log.innerText = "> [GHOST-CEO]: " + (data.response || "Directive Received.");
                input.value = "";
            } catch (err) {
                log.innerText = "> [ERROR]: Connection to Northflank timed out.";
            }
        }
    </script>
</body>
</html>
